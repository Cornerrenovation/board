<style>
:root{--ground:#F2F3EF;--surface:#FFFFFF;--ink:#1B221F;--muted:#5C6A64;--rule:#D3D9D3;--accent:#7A4A2A;--error:#9B2C2C}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}

label{font-size:13px;color:var(--muted)}
input{font:inherit;padding:10px 12px;border:1px solid var(--rule);background:var(--ground);color:var(--ink);border-radius:2px}
button{font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:2px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
#msg{min-height:1.5em;margin:0;font-size:13px;color:var(--error)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

const b=(s)=>Uint8Array.from(atob(s),(c)=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.i)},key,b(P.c)));
}
document.getElementById("f").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const pw=document.getElementById("pw"),go=document.getElementById("go"),msg=document.getElementById("msg");
  go.disabled=true;msg.textContent="";
  try{const html=await unlock(pw.value);document.open();document.write(html);document.close();}
  catch(err){msg.textContent="Wrong password.";go.disabled=false;pw.select();}
});
